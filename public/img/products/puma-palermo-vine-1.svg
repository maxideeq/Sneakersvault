  <!-- brand band across the body -->
  <polygon points="392,570.1 644,425.1 644,413.9 392,558.9" fill="#b6cfa3" opacity="0.85"/>

  <!-- lid -->
  <polygon points="389.2,482.4 655.1,329.4 655.1,287.4 389.2,440.4" fill="#49703e"/>
  <polygon points="389.2,482.4 230.9,391.6 230.9,349.6 389.2,440.4" fill="#395830"/>
